# Temporary one-shot release publisher. Remove after release creation.
name: Publish v7.0 release (one-time)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v7-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out approved v7 code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: e7ba3726730e4c7d52bb50351b178f782ebe5121
          persist-credentials: false

      - name: Publish v7.0 with installer asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: neosmith20/wireguard-install
        run: |
          set -euo pipefail
          grep -Fq 'WireGuard + UFW installer, v7.0' wireguard-install-ufw.sh
          if gh release view v7.0 >/dev/null 2>&1; then
            echo 'v7.0 release already exists; refusing to overwrite.' >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/v7-release-notes.md" <<'RELEASE_NOTES'
          # WireGuard + UFW Installer v7.0
          
          Version 7 delivers a substantial overhaul of the original UFW-based WireGuard installer, with safer firewall defaults, simpler client management, and more predictable installation and cleanup.
          
          ## What's new
          
          - **Randomized VPN network:** Selects a collision-checked `10.x.y.0/24` subnet on first installation, then assigns client addresses sequentially.
          - **UFW-focused security:** Sets restrictive forwarding defaults for new UFW installations. Blocks VPN access to cloud-metadata addresses and, by default, private LAN ranges and services running on the VPN server.
          - **Flexible routing and DNS:** Supports IPv4 full tunnels or split tunnels, two DNS resolvers, and narrow DNS exceptions for private resolvers. Split-tunnel client configurations automatically include missing DNS host routes.
          - **IPv6 options:** Optional IPv6 NAT66 when the host has suitable connectivity, plus IPv6 block mode for IPv4 full-tunnel configurations without enabled IPv6 egress.
          - **Client management:** Add, list, and revoke clients; use WireGuard preshared keys; generate QR codes when available. Client configurations are stored with root-only access.
          - **Safer installation:** Detects SSH ports, asks before replacing firewalld or changing broad firewall behavior, validates WireGuard kernel support before applying firewall changes, and attempts to restore previous firewall settings if installation fails.
          - **Tagged NAT cleanup:** Adds installer-owned identifiers to masquerade rules, removes duplicate live copies on uninstall or rollback, and avoids deleting otherwise identical administrator-created rules.
          - **Multi-distribution installation paths:** Includes support paths for Ubuntu, Debian, Fedora, AlmaLinux, Rocky Linux, CentOS Stream, Oracle Linux, Arch Linux, and Alpine Linux.
          
          ## Install
          
          Download the release's **`wireguard-install-ufw.sh`** asset and run:
          
          ```bash
          sudo bash wireguard-install-ufw.sh
          ```
          
          Re-run the same command to add, list, or revoke clients, or to uninstall the managed server.
          
          ## Upgrading from an earlier installer
          
          **Important:** v7 identifies its NAT rules using tags. If your existing server was installed with v6.1 or earlier, uninstall it using that **original installer version** before installing v7; older untagged NAT entries cannot be recognized by the new cleanup routine. Back up your WireGuard configurations and firewall settings first.
          
          See the [README](https://github.com/neosmith20/wireguard-install#readme) for setup instructions and the [CHANGELOG](https://github.com/neosmith20/wireguard-install/blob/main/CHANGELOG.md) for the full revision history.
          
          MIT licensed. Based on [angristan/wireguard-install](https://github.com/angristan/wireguard-install).
          RELEASE_NOTES
          gh release create v7.0 ./wireguard-install-ufw.sh \
            --target e7ba3726730e4c7d52bb50351b178f782ebe5121 \
            --title 'v7.0 — WireGuard + UFW Installer' \
            --notes-file "$RUNNER_TEMP/v7-release-notes.md" \
            --latest
