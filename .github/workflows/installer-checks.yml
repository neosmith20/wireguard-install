# Automated static checks for the published Bash installer.
# These checks do not execute the installer or change firewall settings.
name: WireGuard installer checks

on:
  push:
    paths:
      - wireguard-install-ufw.sh
      - .github/workflows/installer-checks.yml
  pull_request:
    paths:
      - wireguard-install-ufw.sh
      - .github/workflows/installer-checks.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bash-quality:
    name: Bash syntax, ShellCheck, shfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck shfmt

      - name: Check Bash syntax
        run: bash -n wireguard-install-ufw.sh

      - name: ShellCheck (all severities)
        run: shellcheck -S style wireguard-install-ufw.sh

      - name: Check shfmt formatting (2-space indentation, case indent)
        run: shfmt -i 2 -ci -d wireguard-install-ufw.sh
