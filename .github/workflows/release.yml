# Publishes a GitHub Release whenever the installer's version number changes on main.
#
# The version comes from line 2 of wireguard-install-ufw.sh, e.g.
#   # WireGuard + UFW installer, v8.1 (multi-distribution review candidate)
# If release v8.1 does not exist yet, this workflow runs the same checks as
# installer-checks.yml, then creates tag v8.1 and a release with the script
# and its SHA-256 checksum attached. Pushes that don't change the version are
# skipped, so a release is never duplicated or overwritten.
#
# Release notes are taken from CHANGELOG.md: every section from this version's
# "## X.Y" heading down to the previous release's heading.
name: Release

on:
  push:
    branches: [main]
    paths:
      - wireguard-install-ufw.sh
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Create release for new version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Read version from the script
        id: version
        run: |
          version=$(sed -n -E '2s/^# WireGuard \+ UFW installer, v([0-9]+(\.[0-9]+)*)[[:space:]].*$/\1/p' wireguard-install-ufw.sh)
          if [[ -z "$version" ]]; then
            echo "::error file=wireguard-install-ufw.sh,line=2::Could not read a version like 'v8.1' from line 2."
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "tag=v$version" >>"$GITHUB_OUTPUT"
          echo "Script version: v$version"

      - name: Skip if this version is already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do. Bump the version on line 2 of the script to publish a new release."
            echo "skip=true" >>"$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::warning::Tag $TAG exists without a release; not touching it. Delete the tag or bump the version."
            echo "skip=true" >>"$GITHUB_OUTPUT"
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Install lint tools
        if: steps.exists.outputs.skip == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck shfmt

      - name: Check Bash syntax, ShellCheck, shfmt
        if: steps.exists.outputs.skip == 'false'
        run: |
          bash -n wireguard-install-ufw.sh
          shellcheck -S style wireguard-install-ufw.sh
          shfmt -i 2 -ci -d wireguard-install-ufw.sh

      - name: Build release notes from CHANGELOG.md
        if: steps.exists.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          previous=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          previous="${previous#v}"
          # Print from this version's heading until the previous release's heading.
          awk -v cur="$VERSION" -v prev="$previous" '
            function ver(line,   v) { v = line; sub(/^## v?/, "", v); sub(/[[:space:]].*$/, "", v); return v }
            /^## / {
              if (!on && ver($0) == cur) { on = 1 }
              else if (on && prev != "" && ver($0) == prev) { exit }
              else if (on && $0 ~ /^## (Known validation gaps|License and attribution)/) { exit }
            }
            on { print }
          ' CHANGELOG.md >changes.md
          if [[ ! -s changes.md ]]; then
            echo "::warning::No '## $VERSION' section found in CHANGELOG.md; using a short default note."
            printf '## %s\n\nSee the [CHANGELOG](%s/%s/blob/main/CHANGELOG.md).\n' "$VERSION" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" >changes.md
          fi
          {
            echo "# WireGuard + UFW Installer $TAG"
            echo
            if [[ -n "$previous" ]]; then echo "Changes since v$previous:"; echo; fi
            sed -E 's/^(#{2,}) /#\1 /' changes.md # one level smaller under the title
            echo
            echo "## Install"
            echo
            echo "Download the release's **\`wireguard-install-ufw.sh\`** asset and run:"
            echo
            echo '```bash'
            echo 'sudo bash wireguard-install-ufw.sh'
            echo '```'
            echo
            echo "Re-run the same command for the menu (add, list or revoke clients, find the best MTU, or uninstall)."
            echo "Verify the download with \`sha256sum -c wireguard-install-ufw.sh.sha256\`."
            echo
            echo "See the [README]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY#readme) and the [CHANGELOG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md)."
            echo
            echo "MIT licensed. Based on [angristan/wireguard-install](https://github.com/angristan/wireguard-install)."
          } >notes.md
          cat notes.md

      - name: Create tag and release
        if: steps.exists.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          sha256sum wireguard-install-ufw.sh >wireguard-install-ufw.sh.sha256
          gh release create "$TAG" \
            wireguard-install-ufw.sh \
            wireguard-install-ufw.sh.sha256 \
            --title "$TAG — WireGuard + UFW Installer" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
          echo "Published $TAG"
